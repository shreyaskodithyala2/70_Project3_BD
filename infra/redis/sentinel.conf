# Each Sentinel watches the master and the other Sentinels.
port 26379

# Allow hostnames (redis-1) instead of IPs - container IPs change on restart.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Watch the master called "mymaster" at redis-1:6379.
# The last number is the QUORUM: 2 Sentinels must agree it's down before failover.
sentinel monitor mymaster redis-1 6379 2

# No reply for 5s -> this Sentinel marks the master "subjectively down".
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 20000
# After a failover, re-sync replicas to the new master one at a time.
sentinel parallel-syncs mymaster 1
