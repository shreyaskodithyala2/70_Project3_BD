# Shared by redis-1, redis-2 and redis-3.
# Replicas add "--replicaof redis-1 6379" on their command line (docker-compose.yml).

port 6379
bind 0.0.0.0
# fine inside a private Docker network, never on the internet
protected-mode no

# Persistence: append every write to a log on disk (fsync once per second).
# Without it, a master that restarts quickly comes back EMPTY and its replicas
# would copy that empty dataset.
appendonly yes
appendfsync everysec

# It's also a cache: cap memory and, when full, evict the least-recently-used
# keys that have a TTL (cached images, previews). Keys without a TTL are never
# evicted (running jobs).
maxmemory 512mb
maxmemory-policy volatile-lru

# Replicas are read-only copies; all writes go to the master.
replica-read-only yes
